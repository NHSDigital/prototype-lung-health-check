pages:
  - id: accept-terms
    questions:
      - accept-terms
    heading:
      title: Terms of use
    description: |
      To continue, confirm that you have read and agree to the [NHS Check if you need a lung scan terms of use](terms-of-use).
  - id: phone-questionnaire
    questions:
      - phone-questionnaire
    heading:
      title: Confirm if you have completed a lung cancer risk questionnaire by phone
    description: |
      If you have already completed a questionnaire about your lung health or lung cancer risk by phone you do not need to test the online service. This is because the online service asks the same questions.

      The questionnaire would have asked you questions about:

      - your height and weight
      - your ethnicity
      - your education
      - if you have ever had a cancer diagnosis
      - if your parents, siblings, or children have ever had a lung cancer diagnosis
      - your smoking habits
  - id: smoker
    questions:
      - smoker
    heading:
      title: Tobacco smoking
    description: |
      We will ask you questions about your smoking habits. This includes different types of tobacco smoking such as:

      - cigarettes from a packet
      - rolling tobacco, or roll ups
      - a pipe
      - cigars
      - cigarillos
      - shisha

      It does not currently include vaping or e-cigarettes.
  - id: date-of-birth
    questions:
